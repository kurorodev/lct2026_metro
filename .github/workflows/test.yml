name: tests
on: [push, pull_request]
jobs:
  core:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: pip install -r requirements-runtime.txt
      - run: python -m unittest discover -s tests -v
  ros:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t metro-guard:test .
      - run: docker run --rm --shm-size=1g metro-guard:test python3 scripts/ros_smoke.py
  server:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: docker compose --profile batch config --quiet
      - run: docker compose build processor
      - run: bash scripts/server_smoke.sh
