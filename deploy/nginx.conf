worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 128; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout;
    server_tokens off;
    sendfile on;
    keepalive_timeout 15;
    client_header_timeout 10;
    client_body_timeout 10;
    client_max_body_size 1k;
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;
    gzip on;
    gzip_min_length 1024;
    gzip_types application/json application/javascript text/javascript;
    server {
        listen 8080;
        root /srv/results;
        disable_symlinks on;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Cache-Control "no-cache" always;
        location = /healthz { access_log off; return 200 "ok\n"; }
        location = /readyz {
            access_log off;
            if (-f $document_root/.publishing) { return 503; }
            if (!-f $document_root/summary.json) { return 503; }
            if (!-f $document_root/frames.json) { return 503; }
            if (!-f $document_root/index.html) { return 503; }
            if (!-f $document_root/review.js) { return 503; }
            return 200 "ready\n";
        }
        location = / {
            if (-f $document_root/.publishing) { return 503; }
            if (!-f $document_root/summary.json) { return 503; }
            try_files /index.html =503;
        }
        location ~ ^/(index\.html|review\.js|summary\.json|frames\.json|detections\.jsonl)$ {
            if (-f $document_root/.publishing) { return 503; }
            if (!-f $document_root/summary.json) { return 503; }
            limit_except GET { deny all; }
            try_files $uri =404;
        }
        location / { return 404; }
    }
}
